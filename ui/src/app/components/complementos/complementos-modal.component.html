@if (svc.open()) {
  <div class="cmp-overlay" (click)="onBackdrop($event)">
    <div class="cmp-window" [class.wide]="svc.activeApp() !== 'hub'">
      <button class="cmp-close" (click)="svc.close()" [title]="'common.close' | translate">
        <app-icon name="x" />
      </button>

      @switch (svc.activeApp()) {
        @case ('hub') {
          <div class="cmp-hub">
            <h2 class="cmp-title">{{ 'nav.complementos' | translate }}</h2>
            <p class="cmp-sub">{{ 'complementos.subtitle' | translate }}</p>
            <div class="cmp-grid">
              <button class="cmp-card" (click)="svc.openApp('one-shot')">
                <div class="cmp-card-icon"><app-icon name="zap" /></div>
                <div class="cmp-card-name">One Shot<span class="cmp-card-beta">beta</span></div>
                <div class="cmp-card-desc">{{ 'oneShot.tagline' | translate }}</div>
              </button>
            </div>
          </div>
        }
        @case ('one-shot') {
          @defer (on immediate) {
            <app-one-shot />
          } @loading (minimum 150ms) {
            <div class="cmp-loading">{{ 'stats.loading' | translate }}</div>
          }
        }
      }
    </div>
  </div>
}
