<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HydraOps 3D sandbox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b2f; }
  canvas { display: block; }
  #msg { position: absolute; left: 12px; bottom: 10px; font: 12px system-ui, sans-serif; color: #c7d2fe; opacity: .8; pointer-events: none; }
</style>
</head>
<body>
<div id="msg"></div>
<script>
// The 3D plugin's isolated renderer. This page runs inside
// <iframe sandbox="allow-scripts"> — an opaque origin: model-written code can
// reach neither the app, nor its cookies or storage. Three.js arrives as text
// from the parent (an opaque origin cannot import cross-origin modules
// without CORS, and the dev server sends none) and is imported from a blob
// URL. Everything else is postMessage, guarded by a per-session nonce.
//
// Contract for generated code: the BODY of `function build(THREE, scene, helpers)`.
// It adds meshes to `scene` (a Group cleared before every run). No imports,
// no DOM, no network.
(() => {
  let T = null, renderer, scene, camera, controls, root, grid, nonce = null, wire = false;
  // Clean view: no grid, a soft gradient backdrop and a contact shadow, for pictures.
  let bgColor = "#1b1b2f", clean = false, gridOn = true, shadow = null, backdrop = null;
  const msg = document.getElementById("msg");
  const post = (m, transfer) => parent.postMessage(m, "*", transfer || []);

  window.addEventListener("error", (e) => {
    if (T) post({ type: "error", message: String(e.message || e.error || "error"), line: lineOf(e.error) });
  });
  window.addEventListener("unhandledrejection", (e) => {
    if (T) post({ type: "error", message: String(e.reason?.message || e.reason || "error"), line: lineOf(e.reason) });
  });

  window.addEventListener("message", async (e) => {
    const d = e.data || {};
    if (d.type === "init") { nonce = d.nonce; await init(d.three, d.bg); return; }
    if (!nonce || d.nonce !== nonce || !T) return;
    if (d.type === "run") run(d.code);
    else if (d.type === "export") exportGlb();
    else if (d.type === "snapshot") snapshot();
    else if (d.type === "png") png();
    else if (d.type === "view") view(d.mode, d.value);
  });

  async function init(src, bg) {
    try {
      T = await import(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    } catch (err) {
      post({ type: "fatal", message: "Three.js could not be loaded: " + (err?.message || err) });
      return;
    }
    renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene = new T.Scene();
    bgColor = bg || "#1b1b2f";
    scene.background = new T.Color(bgColor);
    // Image-based lighting: without an environment, metallic materials render
    // black (nothing to reflect). RoomEnvironment is a small procedural studio.
    const pmrem = new T.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.6;
    pmrem.dispose();
    camera = new T.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 2000);
    camera.position.set(6, 5, 8);
    controls = new T.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    scene.add(new T.HemisphereLight(0xffffff, 0x334466, 1.1));
    const sun = new T.DirectionalLight(0xffffff, 1.6);
    sun.position.set(5, 10, 6);
    scene.add(sun);
    fitGrid(5);

    root = new T.Group();
    root.name = "generated";
    scene.add(root);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
    post({ type: "ready", three: T.REVISION });
  }

  // Line number inside the generated code (new Function adds two header lines).
  function lineOf(err) {
    const m = String(err?.stack || "").match(/<anonymous>:(\d+):\d+/);
    return m ? Math.max(1, Number(m[1]) - 2) : null;
  }

  function clearRoot() {
    root.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    });
    root.clear();
    // Generated code may move the group itself (helpers.center(scene)).
    root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.set(1, 1, 1);
  }

  // Frames the object whatever its size: the distance comes from its bounding sphere
  // and the narrower field of view, so a 20 cm pot fills the view like a 10 m house.
  function fit() {
    const box = new T.Box3().setFromObject(root);
    if (box.isEmpty() || ![box.min.x, box.min.y, box.min.z, box.max.x, box.max.y, box.max.z].every(Number.isFinite)) return;
    const size = box.getSize(new T.Vector3());
    const center = box.getCenter(new T.Vector3());
    const radius = Math.max(box.getBoundingSphere(new T.Sphere()).radius, 0.01);
    const vFov = (camera.fov * Math.PI) / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    const distance = (radius / Math.sin(Math.min(vFov, hFov) / 2)) * 1.1;
    controls.target.copy(center);
    camera.position.copy(center).addScaledVector(new T.Vector3(1.2, 0.9, 1.5).normalize(), distance);
    camera.near = distance / 100;
    camera.far = distance * 100;
    camera.updateProjectionMatrix();
    controls.update();
    fitGrid(Math.max(size.x, size.y, size.z));
    placeShadow(box, size);
  }

  // A grid in the object's own scale: 20 cells of a round step (5 cm for a pot, 5 m
  // for a house), instead of fixed 1 m cells that dwarf small objects.
  function fitGrid(maxDim) {
    const step = Math.pow(10, Math.floor(Math.log10(Math.max(maxDim, 0.001)))) / 2;
    if (grid && grid.userData.step === step) return;
    if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
    grid = new T.GridHelper(step * 20, 20, 0x6366f1, 0x33365a);
    grid.userData.step = step;
    grid.visible = gridOn && !clean;
    scene.add(grid);
  }

  // Soft contact shadow under the object (a radial gradient on a plane): cheap, no
  // shadow maps, and it grounds the object in the clean view.
  function placeShadow(box, size) {
    if (!shadow) {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "rgba(0,0,0,0.38)");
      grad.addColorStop(0.55, "rgba(0,0,0,0.14)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      shadow = new T.Mesh(
        new T.PlaneGeometry(1, 1),
        new T.MeshBasicMaterial({ map: new T.CanvasTexture(c), transparent: true, depthWrite: false }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.renderOrder = -1;
      scene.add(shadow);
    }
    const footprint = Math.max(size.x, size.z) * 1.5;
    shadow.scale.set(footprint, footprint, 1);
    shadow.position.set((box.min.x + box.max.x) / 2, box.min.y + footprint * 0.002, (box.min.z + box.max.z) / 2);
    shadow.visible = clean;
  }

  // Vertical gradient from a lighter tint of the theme colour down to the colour itself.
  function gradientBackdrop() {
    if (backdrop) backdrop.dispose();
    const c = document.createElement("canvas");
    c.width = 2; c.height = 256;
    const g = c.getContext("2d");
    const base = new T.Color(bgColor);
    const top = base.clone().lerp(new T.Color(0xffffff), 0.35);
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, "#" + top.getHexString());
    grad.addColorStop(1, "#" + base.getHexString());
    g.fillStyle = grad;
    g.fillRect(0, 0, 2, 256);
    backdrop = new T.CanvasTexture(c);
    backdrop.colorSpace = T.SRGBColorSpace;
    return backdrop;
  }

  function applyClean() {
    if (grid) grid.visible = gridOn && !clean;
    if (shadow) shadow.visible = clean && root.children.length > 0;
    scene.background = clean ? gradientBackdrop() : new T.Color(bgColor);
  }

  // The helper kit the generated code receives. Short constructors that return a
  // positioned, named mesh, a material cache (same color → same material), and
  // building blocks (lathe, extrude, mirror, ring, grid) so the model spends its
  // tokens on the design instead of boilerplate. Documented in the API's system
  // prompt (THREED_SYSTEM) — keep the two in sync.
  function makeHelpers() {
    const materials = new Map();
    const mat = (color = 0x999999, o = {}) => {
      if (color && color.isMaterial) return color;
      const key = [String(color), o.roughness ?? 0.8, o.metalness ?? 0, o.flat ? 1 : 0, o.opacity ?? 1, String(o.emissive ?? 0)].join("|");
      let m = materials.get(key);
      if (!m) {
        const opacity = o.opacity ?? 1;
        m = new T.MeshStandardMaterial({
          color, roughness: o.roughness ?? 0.8, metalness: o.metalness ?? 0, flatShading: !!o.flat,
          transparent: opacity < 1, opacity, emissive: o.emissive ?? 0x000000,
        });
        materials.set(key, m);
      }
      return m;
    };
    // Wrong argument order is the most common mistake in generated code, and three.js
    // turns a non-number into silent NaN geometry. Fail loudly instead: the message
    // (with its line) goes back to the model, which fixes the call.
    const nums = (helper, values) => {
      for (const [label, v] of Object.entries(values)) {
        if (!Number.isFinite(v)) throw new TypeError(`helpers.${helper}: "${label}" must be a number, got ${v && v.isMaterial ? "a material" : typeof v}. Check the argument order.`);
      }
    };
    const place = (helper, mesh, x = 0, y = 0, z = 0, name) => {
      nums(helper, { x, y, z });
      mesh.position.set(x, y, z);
      if (typeof name === "string" && name) mesh.name = name;
      return mesh;
    };
    const mesh = (helper, geometry, color, x, y, z, name) => place(helper, new T.Mesh(geometry, mat(color)), x, y, z, name);
    const looksLikeColor = (v, maxDim) => v === undefined || (v && v.isMaterial) || (v && v.isColor) || typeof v === "string" || (typeof v === "number" && v > maxDim);
    return {
      addons: { BufferGeometryUtils: T.BufferGeometryUtils, RoundedBoxGeometry: T.RoundedBoxGeometry },
      color: (c) => new T.Color(c),
      mat,
      box: (w, h, d, color, x, y, z, name) => { nums("box", { w, h, d }); return mesh("box", new T.BoxGeometry(w, h, d), color, x, y, z, name); },
      // Same order as box, radius last and optional: (w, h, d, color, x, y, z, name, radius).
      // The older (w, h, d, radius, color, x, y, z, name) order is still understood.
      roundedBox: (w, h, d, a, b, ...rest) => {
        nums("roundedBox", { w, h, d });
        let color, x, y, z, name, radius;
        if (looksLikeColor(a, Math.max(w, h, d))) { color = a; [x, y, z, name, radius] = [b, ...rest]; }
        else { radius = a; color = b; [x, y, z, name] = rest; }
        const limit = Math.min(w, h, d) / 2;
        const r = Number.isFinite(radius) && radius >= 0 ? Math.min(radius, limit * 0.98) : limit * 0.3;
        return mesh("roundedBox", new T.RoundedBoxGeometry(w, h, d, 4, r), color, x, y, z, name);
      },
      cylinder: (rTop, rBottom, h, color, x, y, z, segments = 24, name) => {
        nums("cylinder", { rTop, rBottom, h });
        if (typeof segments === "string" && name === undefined) { name = segments; segments = 24; }   // name passed in the segments slot
        return mesh("cylinder", new T.CylinderGeometry(rTop, rBottom, h, Number.isFinite(segments) ? segments : 24), color, x, y, z, name);
      },
      cone: (r, h, color, x, y, z, segments = 24, name) => {
        nums("cone", { r, h });
        if (typeof segments === "string" && name === undefined) { name = segments; segments = 24; }
        return mesh("cone", new T.ConeGeometry(r, h, Number.isFinite(segments) ? segments : 24), color, x, y, z, name);
      },
      sphere: (r, color, x, y, z, name) => { nums("sphere", { r }); return mesh("sphere", new T.SphereGeometry(r, 24, 16), color, x, y, z, name); },
      torus: (r, tube, color, x, y, z, name) => { nums("torus", { r, tube }); return mesh("torus", new T.TorusGeometry(r, tube, 12, 32), color, x, y, z, name); },
      // [[radius, y], ...] revolved around Y.
      lathe: (points, color, segments = 32, name) => {
        if (!Array.isArray(points) || points.length < 2) throw new TypeError("helpers.lathe: points must be an array of [radius, y] pairs.");
        points.forEach(([r, y], i) => nums("lathe", { [`points[${i}][0]`]: r, [`points[${i}][1]`]: y }));
        if (typeof segments === "string" && name === undefined) { name = segments; segments = 32; }
        return mesh("lathe", new T.LatheGeometry(points.map(([r, y]) => new T.Vector2(r, y)), Number.isFinite(segments) ? segments : 32), color, 0, 0, 0, name);
      },
      // [[x, y], ...] outline extruded along Z and centered on z=0.
      extrude: (points, depth, color, o = {}, name) => {
        if (!Array.isArray(points) || points.length < 3) throw new TypeError("helpers.extrude: points must be an array of at least three [x, y] pairs.");
        points.forEach(([px, py], i) => nums("extrude", { [`points[${i}][0]`]: px, [`points[${i}][1]`]: py }));
        nums("extrude", { depth });
        if (typeof o === "string" && name === undefined) { name = o; o = {}; }
        o = o || {};
        const shape = new T.Shape(points.map(([x, y]) => new T.Vector2(x, y)));
        const bevel = o.bevel || 0;
        const g = new T.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });
        g.translate(0, 0, -depth / 2);
        return mesh("extrude", g, color, 0, 0, 0, name);
      },
      group: (name, ...children) => { const g = new T.Group(); g.name = name || ""; children.forEach((c) => c && g.add(c)); return g; },
      // Mirrored copy across x=0 (the renderer handles the flipped winding).
      mirrorX: (obj) => { const c = obj.clone(); c.scale.x *= -1; c.position.x *= -1; c.name = obj.name ? obj.name + "Mirror" : ""; return c; },
      ring: (n, radius, fn, y = 0) => {
        const g = new T.Group();
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          const o = fn(i, Math.cos(a) * radius, Math.sin(a) * radius, a);
          if (o) { o.position.y += y; g.add(o); }
        }
        return g;
      },
      grid: (nx, nz, spacing, fn) => {
        const g = new T.Group();
        for (let ix = 0; ix < nx; ix++) for (let iz = 0; iz < nz; iz++) {
          const o = fn(ix, iz, (ix - (nx - 1) / 2) * spacing, (iz - (nz - 1) / 2) * spacing);
          if (o) g.add(o);
        }
        return g;
      },
      // Deterministic random in [0, 1) so a scene renders the same every time.
      random: (seed = 1) => { let t = seed >>> 0; return () => { t += 0x6d2b79f5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; },
      center: (obj) => { const b = new T.Box3().setFromObject(obj); const c = b.getCenter(new T.Vector3()); obj.position.sub(c); obj.position.y -= b.min.y - c.y; return obj; },
      fit,
    };
  }

  function run(code) {
    clearRoot();
    if (shadow) shadow.visible = false;
    msg.textContent = "";
    const helpers = makeHelpers();
    try {
      const fn = new Function("THREE", "scene", "helpers", code);
      fn(T, root, helpers);
    } catch (err) {
      post({ type: "error", message: String(err?.message || err), line: lineOf(err) });
      return;
    }
    // Raw THREE calls with bad arguments do not throw: they yield NaN vertices or
    // transforms and an empty canvas. Report it as an error so it gets fixed.
    const broken = [];
    root.updateMatrixWorld(true);
    root.traverse((o) => {
      const badTransform = o.matrixWorld.elements.some((v) => !Number.isFinite(v));
      let badGeometry = false;
      const pos = o.isMesh && o.geometry && o.geometry.attributes.position;
      if (pos) { const a = pos.array; for (let i = 0; i < a.length; i++) { if (!Number.isFinite(a[i])) { badGeometry = true; break; } } }
      if (badTransform || badGeometry) broken.push(`${o.name || o.type}${badGeometry ? " (geometry)" : " (position/rotation/scale)"}`);
    });
    if (broken.length) {
      const sample = broken.slice(0, 5).join(", ");
      clearRoot();
      post({ type: "error", message: `${broken.length} object(s) have NaN coordinates: ${sample}. A number was expected where something else was passed (wrong argument order, undefined variable, division by zero).`, line: null });
      return;
    }
    let meshes = 0, triangles = 0;
    root.traverse((o) => {
      if (o.isMesh) {
        meshes++;
        const g = o.geometry;
        if (g) triangles += Math.round((g.index ? g.index.count : g.attributes.position?.count || 0) / 3);
        (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if (m) m.wireframe = wire; });
      }
    });
    fit();
    applyClean();
    msg.textContent = `${meshes} mesh${meshes === 1 ? "" : "es"} · ${triangles} tri`;
    post({ type: "ok", stats: { meshes, triangles } });
  }

  function exportGlb() {
    new T.GLTFExporter().parse(
      root,
      (result) => post({ type: "glb", buffer: result }, [result]),
      (err) => post({ type: "error", message: "Export failed: " + (err?.message || err) }),
      { binary: true },
    );
  }

  // The view as it is on screen, rendered at twice the pixel density, for "Save PNG".
  function png() {
    const ratio = renderer.getPixelRatio();
    renderer.setPixelRatio(Math.max(2, ratio));
    renderer.render(scene, camera);
    const dataUrl = renderer.domElement.toDataURL("image/png");
    renderer.setPixelRatio(ratio);
    renderer.render(scene, camera);
    post({ type: "png", dataUrl });
  }

  // Small PNG for the saved-scenes list (the full canvas would be ~100 kB+).
  function snapshot() {
    renderer.render(scene, camera);
    const src = renderer.domElement;
    const w = 320, h = Math.max(1, Math.round((w * src.height) / src.width));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(src, 0, 0, w, h);
    post({ type: "snapshot", dataUrl: c.toDataURL("image/png") });
  }

  function view(mode, value) {
    if (mode === "wireframe") {
      wire = !!value;
      root.traverse((o) => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if (m) m.wireframe = wire; }); });
    } else if (mode === "grid") {
      gridOn = !!value;
      applyClean();
    } else if (mode === "clean") {
      clean = !!value;
      applyClean();
    } else if (mode === "reset") {
      fit();
    } else if (mode === "bg") {
      bgColor = value;
      applyClean();
    }
  }
})();
</script>
</body>
</html>
