<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HydraOps</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1b1b2f; color: #e5e7f5; font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 460px; padding: 32px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { margin: 0 0 8px; color: #a5a9c8; }
  .dots { display: inline-flex; gap: 6px; margin-top: 18px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: #6366f1; animation: pulse 1.2s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
</style>
</head>
<body>
<!-- Shown by the desktop shell when the app's own page cannot be loaded (the API
     is not answering yet). The main process keeps probing and reloads the app by
     itself; this page only displays text, set with textContent. -->
<main>
  <h1 id="title">HydraOps</h1>
  <p id="body"></p>
  <p id="hint"></p>
  <div class="dots"><span></span><span></span><span></span></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  for (const id of ["title", "body", "hint"]) {
    const text = q.get(id);
    if (text) document.getElementById(id).textContent = text;
  }
</script>
</body>
</html>
