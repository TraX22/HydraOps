<!doctype html><html><head><meta charset="utf-8"><title>social</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;font-family:Inter,Segoe UI,system-ui,sans-serif;color:#fff}
  .bg{position:relative;width:1280px;height:640px;background:radial-gradient(1200px 700px at 15% 10%,#4f46e5 0%,#312e81 45%,#1e1b4b 100%);}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(900px 500px at 70% 60%,#000 20%,transparent 80%)}
  .glow{position:absolute;right:-120px;bottom:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.45),transparent 65%)}
  .wrap{position:absolute;inset:0;padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:26px}
  .brand img{width:118px;height:118px;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .brand h1{margin:0;font-size:84px;font-weight:800;letter-spacing:-2px;line-height:1}
  .brand small{display:block;margin-top:10px;font-size:22px;font-weight:500;color:#c7d2fe;letter-spacing:.5px}
  .tag{font-size:44px;font-weight:600;line-height:1.2;max-width:900px;letter-spacing:-.5px}
  .tag b{color:#a5b4fc;font-weight:800}
  .chips{display:flex;gap:10px;flex-wrap:nowrap}
  .chip{white-space:nowrap;padding:9px 16px;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;font-size:18px;font-weight:500;background:rgba(255,255,255,.08);backdrop-filter:blur(4px)}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:22px;color:#c7d2fe;font-weight:500}
  .foot b{color:#fff;font-weight:600}
