# Builds and publishes the Windows installer when a version tag is pushed.
#
# How to cut a release:
#   1. Bump the version in apps/desktop/package.json (e.g. 0.1.1).
#   2. git commit + git tag v0.1.1 && git push origin main --tags
#   The tag MUST match that version: electron-updater compares the installed
#   version with the one in the latest.yml uploaded here.
#
# Run it by hand (workflow_dispatch) to check that the toolchain still builds the
# installer: everything runs except the publish step, which only runs for a tag.
#
# The installer is still unsigned (SmartScreen warns on the first install); the
# automatic update works the same, by hash. Signing with SignPath comes later.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the Release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # reads the version from packageManager

      # The same Node line the desktop app ships (Electron 44 bundles Node 24).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages, interface and backend
        run: |
          pnpm build
          pnpm --filter ui build
          pnpm build:backend

      # The nats-server binary does not live in the repo; packaging expects it at
      # nats/nats-server-v<ver>-windows-amd64/nats-server.exe (see electron-builder.yml).
      - name: Download nats-server
        shell: pwsh
        run: |
          $ver = "2.10.22"
          $url = "https://github.com/nats-io/nats-server/releases/download/v$ver/nats-server-v$ver-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile nats.zip
          Expand-Archive nats.zip -DestinationPath nats -Force
          if (-not (Test-Path "nats/nats-server-v$ver-windows-amd64/nats-server.exe")) {
            throw "nats-server.exe is not where packaging expects it"
          }

      # electron-builder only BUILDS (the .exe, its .blockmap and latest.yml). We
      # publish with gh ourselves: left to electron-builder, the artifacts upload in
      # parallel before the release exists, two threads create it at once and two
      # drafts come out with the files split between them.
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish never

      - name: Installer built
        shell: pwsh
        working-directory: apps/desktop/release
        run: Get-Item *-setup.exe, *.blockmap, latest.yml | Format-Table Name, Length

      # One Release with the three files the auto-update needs (.exe + latest.yml +
      # .blockmap). --generate-notes writes the changelog. Tags only: a manual run
      # stops at the build.
      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        working-directory: apps/desktop/release
        run: gh release create $env:GITHUB_REF_NAME (Get-Item *-setup.exe, *.blockmap, latest.yml) --title $env:GITHUB_REF_NAME --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided by GitHub Actions, nothing to create
